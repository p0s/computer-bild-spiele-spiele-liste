[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "computer-bild-spiele-game-list"
version = "2026.8.8"
description = "Reproducible extraction and public CSV reconstruction of Computer Bild Spiele cover-disc game titles"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "p0s" }]
dependencies = [
  "tomli>=2.0.1; python_version < '3.11'",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Database",
  "Topic :: Games/Entertainment",
]

[project.urls]
Repository = "https://github.com/p0s/computer-bild-spiele-spiele-liste"

[tool.setuptools]
packages = ["scripts"]

[dependency-groups]
dev = [
  "build==1.3.0",
  "ruff==0.16.1",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
